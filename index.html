<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Crit</title>
<meta name="description" content="A daily design crit: a flawed screen fixes itself in real UI, with the principle behind the fix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EFEFEF; --surface:#FFFFFF; --ink:#000000; --ink-2:#8A8A8A; --line:#DCDCDC; --chip:#E8E8E8; --dots:#D6D6D6;
  --accent:#2B2BFF; --tip:#000000; --tip-ink:#FFFFFF; --tip-2:#8A8A8A; --scrim:rgba(0,0,0,.3);
  --bezel:#1B1D20; --dim:#3A3D42;
  --ios-bg:#F2F2F7; --ios-cell:#FFFFFF; --ios-label:#000000; --ios-2:#8A8A8E; --ios-sep:#C6C6C8;
  --ios-blue:#007AFF; --ios-fill:#E4E4E9; --ios-seg:#FFFFFF; --ios-green:#34C759; --ios-off:#E9E9EA; --grab:#C7C7CC; --ios-alert:rgba(242,242,242,.94);
  --ease:cubic-bezier(.32,.72,0,1);
  --display:"Outfit","Space Grotesk",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0A0A0A; --surface:#161616; --ink:#FFFFFF; --ink-2:#8A8A8A; --line:#262626; --chip:#1F1F1F; --dots:#2A2A2A;
    --accent:#5A5AFF; --tip:#FFFFFF; --tip-ink:#000000; --tip-2:#8A8A8A; --scrim:rgba(0,0,0,.45);
    --bezel:#2C3035; --dim:#0E0F10;
    --ios-bg:#000000; --ios-cell:#1C1C1E; --ios-label:#FFFFFF; --ios-2:#8E8E93; --ios-sep:#38383A;
    --ios-blue:#0A84FF; --ios-fill:#2C2C2E; --ios-seg:#636366; --ios-green:#30D158; --ios-off:#39393D; --grab:#48484A; --ios-alert:rgba(44,44,46,.94);
  }
}
:root[data-theme="dark"]{
  --page:#0A0A0A; --surface:#161616; --ink:#FFFFFF; --ink-2:#8A8A8A; --line:#262626; --chip:#1F1F1F; --dots:#2A2A2A;
  --accent:#5A5AFF; --tip:#FFFFFF; --tip-ink:#000000; --tip-2:#8A8A8A; --scrim:rgba(0,0,0,.45);
  --bezel:#2C3035; --dim:#0E0F10;
  --ios-bg:#000000; --ios-cell:#1C1C1E; --ios-label:#FFFFFF; --ios-2:#8E8E93; --ios-sep:#38383A;
  --ios-blue:#0A84FF; --ios-fill:#2C2C2E; --ios-seg:#636366; --ios-green:#30D158; --ios-off:#39393D; --grab:#48484A; --ios-alert:rgba(44,44,46,.94);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.palette-open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
kbd{font-family:inherit;font-size:12px;font-weight:500;line-height:1;padding:4px 6px;border-radius:6px;background:var(--chip);color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:1160px;margin:0 auto;padding:0 32px 40px}
.page-enter{animation:pageIn .45s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- Header ---------- */
.masthead{background:#000;color:#fff}
.mast-inner{max-width:1160px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.025em;white-space:nowrap}
.logo svg{width:32px;height:32px;flex:none;transition:transform .5s var(--ease)}
.logo:hover svg{transform:rotate(-8deg) scale(1.06)}
.site-nav{display:flex;gap:4px;margin-left:auto}
.site-nav a{text-decoration:none;font-weight:500;font-size:15px;color:#9A9A9A;padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
.site-nav a:hover{color:#fff}
.site-nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
.search-btn{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#BDBDBD;font-size:15px;transition:background .2s,color .2s}
.search-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.search-btn svg{width:16px;height:16px}
.search-btn kbd{background:rgba(255,255,255,.14);color:#BDBDBD}

/* ---------- Home: find pill ---------- */
.find-pill{display:flex;align-items:center;gap:14px;width:100%;max-width:720px;height:64px;margin:36px 0 56px;padding:0 12px 0 22px;border:0;border-radius:999px;
  background:var(--surface);color:var(--ink-2);font-size:17px;text-align:left;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .25s,transform .25s var(--ease)}
.find-pill:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.find-pill:active{transform:scale(.99)}
.find-pill svg{width:20px;height:20px;color:var(--ink);flex:none}
.find-pill .fp-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find-pill .fp-text b{color:var(--ink);font-weight:500}
.find-pill kbd{margin-right:4px}

/* ---------- Lesson module ---------- */
.lesson-mod{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center;margin:0 0 104px}
.lesson-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 18px;font-size:15px;font-weight:500;color:var(--ink-2)}
.theme-link{text-decoration:none;padding:5px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);transition:color .2s,box-shadow .2s}
.theme-link:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.badge{background:var(--ink);color:var(--page);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.lesson-title{margin:0 0 22px;font-family:var(--display);font-weight:900;font-size:clamp(50px,6.8vw,96px);line-height:.88;letter-spacing:-.035em}
.lesson-title a{text-decoration:none}
.lesson-title a:hover{color:var(--accent)}
.lede{margin:0 0 30px;font-size:19px;line-height:1.55;max-width:36ch}
.related-label{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags a{display:block;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;text-decoration:none;transition:background .2s,color .2s}
.tags a:hover{background:var(--ink);color:var(--page)}
.tags .cnt{color:var(--ink-2);margin-left:5px;font-weight:400}
.tags a:hover .cnt{color:inherit;opacity:.6}

/* the canvas: a design-file artboard the phone sits on */
.canvas{position:relative;display:grid;place-items:center;padding:76px 24px 64px;border-radius:32px;background-color:var(--surface);
  background-image:radial-gradient(var(--dots) 1.1px,transparent 1.4px);background-size:20px 20px;background-position:10px 10px}
.canvas-bar{position:absolute;top:18px;left:22px;right:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.frame-label{display:grid;font-size:13px;font-weight:500;color:var(--ink-2)}
.frame-label span{grid-area:1/1;transition:opacity .35s ease}
.frame-label .fb{opacity:0}
[data-state="after"] .frame-label .fa{opacity:0}
[data-state="after"] .frame-label .fb{opacity:1}
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--page)}
.switch::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ink);transition:transform .5s var(--ease)}
[data-state="after"] .switch::before{transform:translateX(100%)}
.switch button{position:relative;border:0;background:transparent;padding:9px 18px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink-2);transition:color .35s}
.switch button[aria-pressed="true"]{color:var(--page)}
.canvas-hint{position:absolute;bottom:18px;left:0;right:0;margin:0;text-align:center;font-size:13px;color:var(--ink-2)}
.canvas-hint kbd{margin:0 2px;background:var(--page)}
@media (hover:none){.canvas-hint{display:none}.canvas{padding-bottom:40px}}

/* lesson page extras */
.helps{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 56px;margin:-56px 0 72px}
.plist{margin:0;padding:0;list-style:none}
.plist a{display:block;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;text-decoration:none;transition:padding .3s var(--ease),color .2s}
.plist li:first-child a{border-top:1px solid var(--line)}
.plist a:hover{padding-left:8px;color:var(--accent)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 64px}
.pager>*{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:24px;padding:22px 24px;text-decoration:none;min-height:104px}
.pager .pnum{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;letter-spacing:-.03em;color:var(--chip);transition:color .3s}
.pager a:hover .pnum{color:var(--accent)}
.pager .dir{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.pager .pt{font-size:19px;font-weight:500;letter-spacing:-.01em}
.pager .next{justify-content:flex-end;text-align:right}
.pager .muted{opacity:.55}
.pager .empty{background:transparent}

/* ---------- The month: 30 tiles ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 8px}
.sec-head h2{margin:0;font-size:30px;letter-spacing:-.03em}
.sec-head p{margin:0;font-size:15px;color:var(--ink-2)}
.month{margin:0 0 88px}
.week-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.week-row:last-child{border-bottom:1px solid var(--line)}
.wk{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.week-name{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-decoration:none}
a.week-name:hover{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1.08;padding:12px;border-radius:18px;text-decoration:none;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tile .tn{font-family:var(--display);font-weight:900;font-size:32px;line-height:1;letter-spacing:-.03em}
.tile .tt{overflow-wrap:anywhere;hyphens:auto;font-size:13px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700}
.tile.live{background:var(--surface)}
.tile.today{background:var(--accent);color:#fff}
.tile.draft{background:var(--surface);outline:1px dashed var(--ink-2);outline-offset:-1px}
.tile.draft .ts{color:var(--ink-2)}
.tile.planned{box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.tile.planned .tn{color:var(--line)}
a.tile:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 18px 28px -18px rgba(0,0,0,.45)}

/* ---------- Lists ---------- */
.list{border-top:1px solid var(--line);margin:0 0 56px}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .3s var(--ease)}
a.lrow:hover{padding-left:8px}
a.lrow:hover .ltitle{color:var(--accent)}
.lnum{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-.03em;color:var(--ink-2)}
.ltitle{font-size:18px;font-weight:500;letter-spacing:-.01em;transition:color .2s}
.why{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.lrow.planned{opacity:.5}
.lstatus{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--chip)}
.lstatus.today{background:var(--accent);color:#fff}
.lstatus.soon{background:transparent;font-weight:500;padding:0;color:var(--ink-2)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .3s var(--ease)}
.prow:hover{padding-left:8px}
.prow:hover .ltitle{color:var(--accent)}
.pcount{font-size:14px;color:var(--ink-2);white-space:nowrap}

/* ---------- Page intros ---------- */
.page-intro{padding:56px 0 44px;max-width:820px}
.crumb{margin:0 0 14px;font-size:15px;font-weight:500;color:var(--ink-2)}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink)}
.page-intro h1{margin:0 0 18px;font-family:var(--display);font-weight:900;font-size:clamp(46px,6.4vw,84px);line-height:.9;letter-spacing:-.035em}
.page-intro p.big{margin:0;font-size:19px;line-height:1.55;max-width:44ch}
.page-intro p.count{margin:14px 0 0;font-size:15px;font-weight:500;color:var(--ink-2)}
.prose{max-width:62ch;font-size:18px;line-height:1.65;margin:0 0 64px}
.prose p{margin:0 0 18px}
.prose h2{margin:40px 0 12px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.prose .reach{display:inline-flex;align-items:center;gap:10px;margin-top:6px;font-weight:700;font-size:16px;text-decoration:none;background:var(--ink);color:var(--page);border-radius:999px;padding:13px 22px;transition:background .2s}
.prose .reach:hover,.prose .reach:focus-visible{background:var(--accent);color:#fff}
.prose .reach svg{width:18px;height:18px}

/* ---------- Find page ---------- */
.bigsearch{position:relative;max-width:720px;margin:0 0 56px}
.bigsearch svg{position:absolute;left:22px;top:50%;width:20px;height:20px;transform:translateY(-50%);pointer-events:none}
.bigsearch input{width:100%;height:64px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);padding:0 22px 0 54px;font:inherit;font-size:18px;
  box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .25s;-webkit-appearance:none;appearance:none}
.bigsearch input::placeholder{color:var(--ink-2)}
.bigsearch input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.sub-h{margin:0 0 14px;font-size:15px;font-weight:500;color:var(--ink-2)}
.groups{margin:0 0 64px}
.group{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.group h3{margin:0;font-size:19px;letter-spacing:-.015em}
.group .list{border-top:0;margin:0}
.group .prow:first-child{padding-top:0}
.screens{margin:0 0 72px}
.empty-note{margin:0 0 40px;padding:20px 0;color:var(--ink-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---------- Newsletter ---------- */
.nl{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,360px);gap:22px;align-items:center;background:var(--surface);border-radius:28px;padding:24px 26px;margin:0 0 56px}
.nl-icon{width:64px;height:64px;border-radius:16px;background:var(--ink);color:var(--page);display:grid;place-items:center;position:relative}
.nl-icon svg{width:30px;height:30px}
.nl-icon::after{content:"";position:absolute;right:11px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.nl h3{margin:0 0 4px;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em}
.nl p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-2);max-width:48ch}
.nl-form{display:flex;gap:8px;min-width:0}
.nl-form input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--page);border:1px solid transparent;border-radius:999px;padding:12px 18px;outline:none;transition:border-color .2s}
.nl-form input::placeholder{color:var(--ink-2)}
.nl-form input:focus{border-color:var(--accent)}
.nl-form button{font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--page);border:0;border-radius:999px;padding:13px 20px;white-space:nowrap;cursor:pointer;transition:background .2s}
.nl-form button:hover,.nl-form button:focus-visible{background:var(--accent);color:#fff}
.nl-form button:disabled{opacity:.5;cursor:default}
.nl-msg{grid-column:3;margin:-16px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.nl-msg:empty{display:none}
.nl.sent .nl-form{display:none}
.nl.sent .nl-msg{grid-column:3;margin:0;padding:0;font-size:15px;color:var(--ink)}

.site-foot{max-width:1160px;margin:0 auto;padding:28px 32px 48px;color:var(--ink-2);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot-end{display:flex;align-items:center;gap:14px}
.foot-li{display:grid;place-items:center;width:32px;height:32px;margin:-6px 0;border-radius:8px;color:var(--ink-2);transition:color .2s}
.foot-li:hover,.foot-li:focus-visible{color:var(--accent)}
.foot-li svg{width:18px;height:18px}

/* ---------- Command palette ---------- */
.pal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.palette{position:fixed;z-index:51;left:50%;top:calc(env(safe-area-inset-top,0px) + 11vh);width:min(640px,calc(100vw - 24px));max-height:min(560px,76vh);display:flex;flex-direction:column;
  background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transform:translate(-50%,10px) scale(.98);transition:opacity .2s,transform .4s var(--ease)}
.palette-open .pal-backdrop{opacity:1;pointer-events:auto}
.palette-open .palette{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.pal-top{display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;height:64px;border-bottom:1px solid var(--line);flex:none}
.pal-top svg{width:20px;height:20px;flex:none}
.pal-top input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;outline:none}
.pal-top input::placeholder{color:var(--ink-2)}
.pal-close{border:0;background:transparent;padding:0}
.pal-list{overflow-y:auto;padding:8px;overscroll-behavior:contain}
.pal-sec{margin:10px 12px 6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.pal-item{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;text-decoration:none;cursor:pointer}
.pal-item[aria-selected="true"]{background:var(--page)}
.pal-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--chip);font-family:var(--display);font-weight:900;font-size:17px}
.pal-ic.live{background:var(--accent);color:#fff}
.pal-ic svg{width:18px;height:18px}
.pal-txt{min-width:0}
.pal-t{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-s{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-none{padding:20px 12px;color:var(--ink-2);font-size:15px;margin:0}
.pal-foot{display:flex;gap:18px;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);flex:none}
@media (hover:none){.pal-foot{display:none}}
/* ---------- Device ---------- */
.phone{position:relative;width:min(340px,calc(100vw - 76px));height:660px;border-radius:46px;overflow:hidden;
  background:var(--dim);box-shadow:0 0 0 9px var(--bezel),0 40px 70px -24px rgba(15,18,22,.45);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ios-label)}
.status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;color:#fff;font-size:15px;font-weight:600}
.icons{display:flex;gap:6px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:#fff;border-radius:1px}
.batt{width:24px;height:11px;border:1.5px solid rgba(255,255,255,.55);border-radius:3.5px;padding:1px}
.batt i{display:block;height:100%;width:75%;background:#fff;border-radius:1.5px}

/* Transition primitive: collapse / expand */
.c{display:grid;grid-template-rows:1fr;opacity:1;
  transition:grid-template-rows .62s var(--ease) var(--delay,0s),opacity .38s ease var(--delay,0s)}
.c>div{min-height:0;overflow:hidden}
.bad-only{--delay:calc(.12s + var(--d,0) * 45ms)}
.after .bad-only{grid-template-rows:0fr;opacity:0;--delay:calc(var(--d,0) * 45ms)}
.good-only{grid-template-rows:0fr;opacity:0;--delay:0s}
.after .good-only{grid-template-rows:1fr;opacity:1;--delay:calc(.24s + var(--d,0) * 60ms)}
/* Transition primitive: swap text */
.swap{display:inline-grid}
.swap>span{grid-area:1/1;transition:opacity .4s ease .25s}
.swap .sb{opacity:0}
.after .swap .sa{opacity:0;transition-delay:0s}
.after .swap .sb{opacity:1}
.swap .sb,.after .swap .sa{pointer-events:none}
.after .swap .sb{pointer-events:auto}
.swap.end{justify-items:end;align-items:center}
/* Transition primitive: collapse / expand sideways (.cx with bad-only or good-only, inside a flex row) */
.cx{flex:1 1 0;min-width:0;overflow:hidden;transition:flex-grow .62s var(--ease) var(--delay,0s),opacity .38s ease var(--delay,0s)}
.after .cx.bad-only,.cx.good-only{flex-grow:0}
.after .cx.good-only{flex-grow:1}

/* Transition primitive: preset (data-before / data-after set a control's value per state; empty = unset) */

@keyframes pin{from{opacity:0;transform:translateX(6px)}}
.primary{transition:background .3s,color .3s}
.primary[aria-disabled="true"]{background:var(--ios-fill);color:var(--ios-2)}
/* Transition primitive: restyle (data-bad / data-good list the classes an element wears in each state; colors, spacing, type size and width animate) */
.phone [data-bad],.phone [data-good]{transition:background-color .45s ease var(--delay),color .45s ease var(--delay),box-shadow .45s ease var(--delay),border-color .45s ease var(--delay),
  margin .62s var(--ease) var(--delay),padding .62s var(--ease) var(--delay),gap .62s var(--ease) var(--delay),
  font-size .62s var(--ease) var(--delay),letter-spacing .62s var(--ease) var(--delay),width .62s var(--ease) var(--delay),opacity .38s ease var(--delay);
  --delay:calc(.12s + var(--d,0) * 60ms)}
.after [data-bad],.after [data-good]{--delay:calc(.24s + var(--d,0) * 60ms)}

/* Transition primitive: modal (.modal overlay after .screen holds .alert dialogs; only the first open one shows,
   [data-dismiss] closes it and the next appears; the dimmed overlay fades out when none are left; bad-only/good-only pick the state.
   Dialogs sit a little below center, leaving room for the lesson tooltip above them) */
.modal{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding-top:80px;border-radius:12px 12px 0 0;background:rgba(0,0,0,.32);
  transition:opacity .35s ease,visibility 0s linear 0s}
.modal:not(:has(.alert:not(.shut))),.after .modal.bad-only,.modal.good-only{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.after .modal.good-only:has(.alert:not(.shut)){opacity:1;visibility:visible;transition:opacity .35s ease .3s,visibility 0s linear 0s}
.alerts{position:relative;display:grid;width:270px;max-width:calc(100% - 28px)}
.alert{grid-area:1/1;align-self:center;width:100%;border-radius:14px;overflow:hidden;text-align:center;background:var(--ios-alert);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:opacity .25s ease .2s,transform .4s var(--ease) .2s}
.alert:not(.shut)~.alert,.alert.shut:not(:last-child){position:absolute}
.alert:not(.shut)~.alert{opacity:0;transform:scale(1.12);pointer-events:none}
.alert.shut{opacity:0;pointer-events:none;transition-delay:0s}
.alert .ri{width:44px;height:44px;border-radius:11px;margin:20px auto -6px}

.alert .stars svg{width:26px;height:26px}
.alert-btns{display:flex;margin-top:19px;position:relative}
.alert-btns::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--ios-sep);transform:scaleY(.5);transform-origin:top}
.alert-btns button{flex:1 1 0;min-width:0;height:44px;border:0;background:transparent;color:var(--ios-blue);font-size:17px;position:relative}
.alert-btns button+button::before{content:"";position:absolute;top:0;bottom:0;left:0;width:1px;background:var(--ios-sep);transform:scaleX(.5);transform-origin:left}
.alert-btns button:active,.alert-btns button.tap{background:var(--ios-fill)}

  transition:opacity .25s ease,transform .4s var(--ease)}

.beacon::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);z-index:-1;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2);opacity:0}}

}
@media (max-width:440px){

}

const LESSONS = [
  { n:1, slug:'decision-overload', title:'Decision overload', theme:'choices', status:'live', frame:'Export sheet',

// One plain-language definition per principle, keyed by its tag slug (slugify of the tag name).
// Shown on the principle's tag page. Add one for every new tag when building a lesson.
const PRINCIPLES = {
  'hicks-law': 'The more options people have, the longer they take to choose. Decision time grows with the number and complexity of the choices.',
  'smart-defaults': 'Preselect the option most people would pick, so they only have to act when their situation is different.',
  'progressive-disclosure': 'Show only what most people need first, and reveal advanced or rarely used options when someone asks for them.',
  'chunking': 'Break information into small, meaningful groups, so it is easier to scan, understand and remember.',
  'goal-gradient-effect': 'People speed up as they get closer to a goal, so showing progress helps them finish what they started.',
  'form-design': 'The craft of making forms quick to fill in: ask only for what you need, in a clear order, with labels people understand.',
  'default-effect': 'People tend to stick with whatever is preselected, so a default quietly decides what most of them end up choosing.',
  'recognition-over-recall': 'Recognizing something you can see is easier than remembering it from scratch, so show the options instead of making people recall them.',
  'cognitive-load': 'The mental effort a screen asks for. Every extra thing to read, remember or decide adds to it, and too much makes people slow down or give up.',
  'paradox-of-the-active-user': 'People skip manuals and tours and start using a product right away, even when learning first would save them time.',
  'just-in-time-learning': 'Teach something at the moment someone needs it, inside the task, rather than up front before they have started.',
  'empty-states': 'What a screen shows when there is nothing in it yet. A good one explains what belongs there and how to add the first item.',
  'visibility-of-system-status': 'Keep people informed about what is going on, with clear feedback at the right moment.',
  'information-architecture': 'How content is organized, grouped and labeled, so people can find what they need and know where they are.',
  'serial-position-effect': 'People remember the first and last items in a list best, and the ones in the middle least.',
  'von-restorff-effect': 'When several similar things appear together, the one that looks different is the one people notice and remember.',
  'visual-hierarchy': 'Using size, color, weight and position to show what matters most, so people see things in the order you intend.',
  'law-of-proximity': 'Things that sit close together look like they belong together. Spacing alone tells people what is grouped, before they read a word.',
  'contrast': 'Making things clearly different in size, color, weight or shape, so the difference itself tells people what matters and what belongs together.',
  'common-region': 'Things inside the same boundary, like a card or a box, look like one group, even when they sit apart or look different.',
  'f-shaped-reading-pattern': 'On text-heavy screens, people read the first line or two, then scan down the left edge. Words further along a line, or deep in a paragraph, often go unseen.',
  'inverted-pyramid': 'Put the most important information first, then the details, so people get the point even if they stop reading early.',
  'alignment': 'Lining things up along shared edges or centers. Fewer, cleaner edges give the eye a clear line to follow, so a layout looks orderly and intentional.',
  'grid-systems': 'A shared set of columns, margins and spacing that every element snaps to, so screens stay aligned and consistent without measuring each one by hand.',
  'consistency-and-standards': 'The same kind of thing should look and work the same way everywhere, so once people learn it in one place, they know it in every other.',
  'jakobs-law': 'People spend most of their time in other apps and sites, so they expect yours to work the same way as the ones they already know.',
  'banner-blindness': 'People learn to skip anything that looks like an ad or a promo, such as banners and popups, without reading it, even when it holds something useful.',
  'habituation': 'When people see the same thing again and again, they stop noticing it and respond on autopilot, like tapping OK on a dialog without reading it.'
};

const problemById = id => PROBLEMS.find(p => p.id === id);
const screenById = id => SCREENS.find(x => x.id === id);
const lessonsFor = (field, id) => LESSONS.filter(l => (l[field] || []).includes(id))
  .sort((a, b) => (visible(b) - visible(a)) || a.n - b.n);

/* ---------- search: weighted keyword matching, all in the browser ---------- */
const STOP = new Set('a an the to of and or is are am my our i it its on in for with be can cant can’t dont don’t do does not they them people users user when how what why this that so very get gets at from by their there some me we us want need help too many much really just something thing things keep keeps'.split(' '));
const stem = w => w.length > 4 ? w.replace(/(ing|ed|es|s)$/, '') : w;
const words = t => String(t).toLowerCase().replace(/[’']/g, '').split(/[^a-z0-9]+/).filter(Boolean).map(stem);
const queryTokens = q => words(q).filter(w => w.length > 1 && !STOP.has(w));
const SEARCH_INDEX = LESSONS.map(l => ({ l, fields: [
  { w:5, t:l.title }, { w:4, t:(l.tags||[]).join(' ') },
  { w:4, t:(l.problems||[]).map(id => problemById(id).label).join(' ') },
  { w:4, t:(l.phrases||[]).join(' | ') }, { w:3, t:l.synonyms || '' }, { w:2, t:(l.screens||[]).map(id => screenById(id).title).join(' ') },
  { w:1, t:l.lede || '' }, { w:1, t:l.steps ? Object.values(l.steps).map(x => x.title + ' ' + x.body).join(' ') : '' }
].map(f => ({ w:f.w, text:f.t.toLowerCase(), ws:words(f.t) })) }));
function scoreFields(fields, toks, phrase){
  let score = 0, hits = 0;
  toks.forEach(q => {
    let hit = false;
    fields.forEach(f => { if (f.ws.some(w => w.startsWith(q) || (q.length > 3 && w.length > 3 && q.startsWith(w)))) { score += f.w; hit = true; } });
    if (hit) hits++;
  });
  if (phrase.length > 3) fields.forEach(f => { if (f.text.includes(phrase)) score += f.w * 2; });
  return toks.length ? score * (hits / toks.length) : 0;
}
function search(q){
  const toks = queryTokens(q), phrase = q.trim().toLowerCase();
  if (!toks.length) return { lessons:[], problems:[] };
  const lessons = SEARCH_INDEX.map(x => ({ l:x.l, s:scoreFields(x.fields, toks, phrase) }))
    .filter(x => x.s >= 3).sort((a, b) => b.s - a.s || (visible(b.l) - visible(a.l)) || a.l.n - b.l.n).map(x => x.l);
  const problems = PROBLEMS.map(p => ({ p, s:scoreFields([{ w:1, text:p.label.toLowerCase(), ws:words(p.label) }], toks, phrase) }))
    .filter(x => x.s >= 0.5).sort((a, b) => b.s - a.s).slice(0, 4).map(x => x.p);
  return { lessons, problems };
}


let eng = null;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function unmount(){ if (!eng) return; clearTimeout(eng.timer); eng.auto.forEach(clearTimeout); eng.ac.abort(); eng = null; }

function mount(lesson){
  const root = app.querySelector('[data-lesson-root]');
  const tpl = document.getElementById('tpl-' + lesson.slug);
  if (!root || !tpl) return;
  const phone = root.querySelector('.phone');
  const sheet = phone.querySelector('.sheet');
  sheet.insertAdjacentHTML('beforeend', tpl.innerHTML + '<div class="fade"></div>');
  phone.insertAdjacentHTML('beforeend', `
    <div class="ring" aria-hidden="true"></div>
    <button class="beacon" aria-label="Show tip">?</button>
    <div class="tip" role="status" aria-live="polite">
      <span class="arrow"></span>
      <div class="tip-head"><span class="dot"></span><span class="t-label"></span><span class="step t-step"></span>
        <button class="tip-close" aria-label="Hide tip"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
      <h2 class="t-title"></h2><p class="t-body"></p><button class="cta"></button>
    </div>`);
  const ac = new AbortController();
  const on = (el, ev, fn, opts) => el.addEventListener(ev, fn, Object.assign({ signal: ac.signal }, opts || {}));
  const e = eng = {
    lesson, ac, state:'before', timer:null, auto:[], root, phone,
    screen: sheet.querySelector('.screen'),
    tip: phone.querySelector('.tip'), arrow: phone.querySelector('.arrow'),
    ring: phone.querySelector('.ring'), beacon: phone.querySelector('.beacon'),
    switches: root.querySelectorAll('.switch button')
  };
  const step = () => lesson.steps[e.state];
  // Let people look at the screen before the tooltip starts explaining it (the After transition adds 500ms).
  const LOOK = 2000;

  // Preset primitive: [data-before]/[data-after] give a control's value in each state ("" = unset).
  // [data-gate] buttons stay disabled while any choice on the screen is unset.
  function gate(){
    const unset = [...sheet.querySelectorAll('[data-values] .v')].some(v => !v.textContent) ||
      [...sheet.querySelectorAll('.seg')].some(sg => !sg.querySelector('[aria-pressed="true"]'));
    sheet.querySelectorAll('[data-gate]').forEach(b => b.setAttribute('aria-disabled', String(unset)));
  }
  // Carousel primitive: [data-carousel] holds .slides (swipe, or tap [data-next] to advance);
  // its .progress and [data-count] follow the current slide, and [data-next] reads [data-last] on the last one.
  function carousel(c){
    const s = c.querySelector('.slides'), n = s.children.length, i = Math.round(s.scrollLeft / (s.clientWidth || 1));
    c.querySelectorAll('.progress i').forEach((x, k) => x.classList.toggle('on', k <= i));
    c.querySelectorAll('[data-count]').forEach(x => { x.textContent = (i + 1) + ' of ' + n; });
    c.querySelectorAll('[data-next]').forEach(b => { if (!b.dataset.busy) b.textContent = i === n - 1 ? (b.dataset.last || b.dataset.next) : b.dataset.next; });
    return { s, i, n };
  }
  function presets(state, animate){
    sheet.querySelectorAll('.field').forEach(f => { f.value = ''; });
    sheet.querySelectorAll('.shut').forEach(c => c.classList.remove('shut'));
    sheet.querySelectorAll('[data-carousel]').forEach(c => { c.querySelector('.slides').scrollLeft = 0; carousel(c); });
    sheet.querySelectorAll('[data-pick] button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    // Restyle primitive: [data-bad]/[data-good] list the classes an element wears in each state; CSS transitions the change.
    sheet.querySelectorAll('[data-bad],[data-good]').forEach(el => {
      const cls = k => (el.dataset[k] || '').split(' ').filter(Boolean);
      el.classList.remove(...cls(state === 'after' ? 'bad' : 'good'));
      el.classList.add(...cls(state === 'after' ? 'good' : 'bad'));
    });
    sheet.querySelectorAll('[data-before],[data-after]').forEach(el => {
      if (!el.hasAttribute('data-' + state)) return;
      const val = el.getAttribute('data-' + state);
      if (el.classList.contains('seg') || el.hasAttribute('data-pick')) el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent.trim() === val)));
      else if (el.matches('.sw, .tick')) el.setAttribute('aria-checked', String(val === 'true'));
      else {
        const v = el.querySelector('.v'); if (!v || v.textContent === val) return;
        v.textContent = val; v.classList.remove('pin');

      }
    });

  // Modal autoplay: a .modal[data-auto="ms"] plays itself in the state it shows in. Each alert but the last stays up
  // for that long, then its first [data-dismiss] button is tapped; the last one waits for the person. Returns when
  // the last one is showing (0 if none), so the tooltip waits for it.
  function autoplay(state, lead){
    e.auto.forEach(clearTimeout); e.auto = [];
    const m = sheet.querySelector('.modal[data-auto]');
    if (!m || m.classList.contains(state === 'after' ? 'bad-only' : 'good-only')) return 0;
    const hold = +m.dataset.auto || 500, appear = reduce ? 0 : 600;
    let t = reduce ? 0 : lead || 0;
    const alerts = [...m.querySelectorAll('.alert')];
    alerts.slice(0, -1).forEach((a, i) => {
      t += (i ? appear : 0) + hold;
      const b = a.querySelector('[data-dismiss]'), at = t;
      e.auto.push(setTimeout(() => b && b.classList.add('tap'), at - 160));
      e.auto.push(setTimeout(() => { if (b) b.classList.remove('tap'); a.classList.add('shut'); }, at));
    });

  function position(){
    const tipOn = e.tip.classList.contains('show');
    if (!tipOn && !e.beacon.classList.contains('show')) return;
    const a = phone.querySelector(step().anchor);

    e.beacon.style.left = Math.min(ar.right - pr.left - 22, pr.width - 40) + 'px';
    e.beacon.style.top = Math.max(ar.top - pr.top - 12, 58) + 'px';

    }
    const left = Math.min(Math.max(ar.left - pr.left + ar.width/2 - w/2, 14), pr.width - w - 14);
    e.tip.style.top = top + 'px'; e.tip.style.left = left + 'px';

    e.tip.querySelector('.cta').textContent = s.cta;
    e.beacon.classList.remove('show');
    e.tip.classList.add('show'); position(); e.ring.classList.add('show');
  }
  function hideAll(){ e.tip.classList.remove('show'); e.beacon.classList.remove('show'); e.ring.classList.remove('show'); }
  function dismiss(){ e.tip.classList.remove('show'); e.ring.classList.remove('show'); e.beacon.classList.add('show'); position(); e.beacon.focus({ preventScroll:true }); }
  function go(next){
    clearTimeout(e.timer); hideAll(); e.state = next;
    e.switches.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === next)));
    root.dataset.state = next;
    const apply = () => { phone.classList.toggle('after', next === 'after'); presets(next, true); const done = autoplay(next, 400); e.timer = setTimeout(showTip, Math.max(reduce ? LOOK : LOOK + 500, done + 600)); };
    if (e.screen.scrollTop > 0) { e.screen.scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' }); e.timer = setTimeout(apply, reduce ? 0 : 340); }
    else e.timer = setTimeout(apply, reduce ? 0 : 220);
  }

  e.switches.forEach(b => on(b, 'click', () => {
    if (b.dataset.s !== e.state) go(b.dataset.s); else if (!e.tip.classList.contains('show')) showTip();
  }));
  on(phone, 'click', ev => {
    const t = ev.target;
    if (t.closest('.tip-close')) return dismiss();
    if (t.closest('.cta')) return go(e.state === 'before' ? 'after' : 'before');
    if (t.closest('.beacon')) return showTip();
    const segB = t.closest('.seg button, [data-pick] button');
    if (segB) { segB.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === segB))); gate(); return; }
    const nx = t.closest('[data-next]');

      if (i < n - 1) { s.scrollTo({ left:(i + 1) * s.clientWidth, behavior: reduce ? 'auto' : 'smooth' }); return; } }
    const dm = t.closest('[data-dismiss]');
    if (dm) { dm.closest('.alert, .c').classList.add('shut'); setTimeout(() => { if (eng === e) position(); }, 650); return; }
    const sw = t.closest('.sw, .tick');
    if (sw) { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); return; }
    const cyc = t.closest('[data-values]');

    const done = t.closest('[data-done]');
    if (done && done.getAttribute('aria-disabled') !== 'true' && !done.dataset.busy) {

    }

  on(e.screen, 'scroll', position, { passive:true });
  on(e.screen, 'scroll', ev => { if (ev.target.classList.contains('slides')) carousel(ev.target.closest('[data-carousel]')); }, { capture:true, passive:true });
  on(window, 'resize', position);
  on(document, 'keydown', ev => {
    if (document.body.classList.contains('palette-open')) return;
    if (ev.key === 'Escape' && e.tip.classList.contains('show')) return dismiss();
    if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === 'ArrowRight' && e.state === 'before') { ev.preventDefault(); go('after'); }
    if (ev.key === 'ArrowLeft' && e.state === 'after') { ev.preventDefault(); go('before'); }
  });
  presets('before', false);
  e.timer = setTimeout(showTip, Math.max(LOOK, autoplay('before') + 600));
}

});
pal.list.addEventListener('mousemove', ev => { const el = ev.target.closest('.pal-item'); if (el && +el.dataset.i !== pal.sel) palSelect(+el.dataset.i); });
pal.list.addEventListener('click', ev => { if (ev.target.closest('.pal-item')) palClose(); });
document.addEventListener('click', ev => {
  if (ev.target.closest('[data-palette]')) { ev.preventDefault(); palOpen(); }
  else if (ev.target.closest('[data-pal-close]')) palClose();
});
document.addEventListener('keydown', ev => {
  const open = document.body.classList.contains('palette-open');
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); open ? palClose() : palOpen(); return; }
  if (open && ev.key === 'Escape') { ev.preventDefault(); palClose(); return; }
  if (!open && ev.key === '/' && !(ev.target.closest && ev.target.closest('input, textarea'))) { ev.preventDefault(); palOpen(); }
});
if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) document.querySelectorAll('kbd').forEach(k => { if (k.textContent === '⌘K') k.textContent = 'Ctrl K'; });

/* =========================================================
   ROUTER
   ========================================================= */
function route(){
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const parts = (path || '').split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '').get('q') || '';
  let page = null, nav = '';
  if (!parts.length) page = pageHome();
  else if (parts[0] === 'lessons' && parts[1]) { page = pageLesson(parts[1]); nav = 'lessons'; }
  else if (parts[0] === 'lessons') { page = pageLessons(); nav = 'lessons'; }
  else if (parts[0] === 'themes') { page = pageTheme(parts[1]); nav = 'lessons'; }
  else if (parts[0] === 'tags') { page = pageTag(parts[1]); nav = 'lessons'; }
  else if (parts[0] === 'about') { page = pageAbout(); nav = 'about'; }
  else if (parts[0] === 'find') { page = pageFind(q); nav = 'find'; }
  else if (parts[0] === 'problems') { page = pageProblem(parts[1]); nav = 'find'; }
  else if (parts[0] === 'screens') { page = pageScreen(parts[1]); nav = 'find'; }
  if (!page) { page = pageHome(); nav = ''; }
  unmount();
  palClose();
  app.innerHTML = page.html;
  app.classList.remove('page-enter'); void app.offsetWidth; app.classList.add('page-enter');
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const h = app.querySelector('h1');
  document.title = (parts.length && h ? h.textContent + ' | ' : '') + 'Daily Crit';
  trackPage(parts.join('/'));
  if (q) trackSearch(q);
  if (!(parts[0] === 'find' && document.activeElement && document.activeElement.id === 'q')) window.scrollTo(0, 0);
  if (page.lesson) mount(page.lesson);
  if (page.find !== undefined) {
    renderResults(page.find);
    const input = document.getElementById('q');
    input.addEventListener('input', () => {
      renderResults(input.value);
      trackSearch(input.value);
      history.replaceState(null, '', '#/find' + (input.value.trim() ? '?q=' + encodeURIComponent(input.value) : ''));
    });
  }
}
document.addEventListener('submit', ev => {
  if (ev.target.closest('[data-search]')) ev.preventDefault();
  const form = ev.target.closest('[data-newsletter]');
  if (!form) return;
  ev.preventDefault();
  const box = form.closest('.nl'), msg = box.querySelector('.nl-msg'), input = form.elements.email, btn = form.querySelector('button');
  const email = input.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = 'That email doesn\u2019t look quite right.'; input.focus(); return; }
  if (!NEWSLETTER_URL) { msg.textContent = 'Signups open soon.'; return; }
  btn.disabled = true; msg.textContent = '';
  fetch(NEWSLETTER_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({ email }) })
    .then(() => { box.classList.add('sent'); msg.textContent = 'Almost done. Check your inbox to confirm.'; })
    .catch(() => { btn.disabled = false; msg.textContent = 'Couldn\u2019t subscribe just now. Please try again.'; });
});
window.addEventListener('hashchange', route);
route();
})();
</script>
